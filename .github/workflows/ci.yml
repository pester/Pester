# GitHub Actions CI — the CI for Pester.
#
# This replaces azure-pipelines.yml, which is removed in the same change. Only
# releasing still runs on Azure DevOps (azure-pipelines-publish.yml), because it
# needs the signing service connection and the publishing variable groups.
#
# Shape: build once on Windows, publish the built module as an artifact, then fan
# out the test matrix (all 8 legs run in parallel), then a single "Done" gate.
#
# Coverage: each leg runs `test.ps1 -CC`, producing a JaCoCo coverage.xml. We
# surface it in the run's job summaries (per leg, plus a consolidated table in
# "Done") and keep the raw coverage.xml as an artifact.
#
# Test results and coverage are rendered into this run's job summaries, by this
# workflow, with a read-only token. Nothing renders them from a privileged
# context. A `workflow_run` workflow would run in the base repository with a
# writable token while reading artifacts a fork pull request produced, which is
# a privilege boundary we do not want to have. Writing to GITHUB_STEP_SUMMARY
# needs no token, so the summary works the same for fork pull requests.
#
# Keep it that way: no `pull_request_target`, no `workflow_run`, and no job that
# consumes fork-produced artifacts with write permissions. That is what lets
# fork pull requests run without a maintainer approving each one.
#
# Image policy: GA only. We float `*-latest` for the newest GA image and pin the
# one previous GA image ("latest + reasonably recent"). No preview images
# (macos-26, windows-2025-vs2026) are used. Note macos-14 is on the deprecation
# clock (brownouts Oct 2026, removal Nov 2 2026) — swap it out before then.
name: CI

on:
  push:
    branches: [main, 'rel/*']
    paths-ignore:
      - '.devcontainer/**'
      - '.vscode/**'
      - 'docs/**'
      - 'images/**'
      - '**/*.md'
  # No branches filter on purpose. A pull request in a stack targets the branch
  # below it, not main, and CI has to run there too. The filter never protected
  # anything either: with the pull_request trigger a run from a fork gets a
  # read-only token and no secrets whatever branch it targets, so the filter only
  # ever skipped runs we wanted.
  #
  # Still no paths-ignore. "Done" below is a required check and it lives in this
  # workflow, so a run skipped by a path filter means "Done" never reports and the
  # pull request stays Pending forever with nothing to click. A job skipped by an
  # `if:` reports as skipped, which counts as passed, but a workflow skipped by a
  # filter reports nothing at all. So the workflow always runs and the expensive
  # jobs opt out instead, see the `changes` job below.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
  DOTNET_NOLOGO: '1'
  CI: '1'

# Supersede in-flight runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the pull request so a documentation-only change does not pay for the
  # build, the 8 leg matrix and a Windows runner. Roughly ten seconds, no checkout.
  #
  # Fail closed on purpose. Everything downstream asks `code != 'false'` rather than
  # `code == 'true'`, so a failed API call, a truncated file list or an event this
  # does not understand all end up running the tests. The only way to skip them is a
  # positive answer that every changed file is documentation.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail

          run_everything() {
            echo "$1"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # push and workflow_dispatch have no base to compare against.
          [ "$EVENT" = "pull_request" ] || run_everything "Event is $EVENT, running everything."

          files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename') \
            || run_everything "Could not list the changed files, running everything."
          [ -n "$files" ] || run_everything "No changed files reported, running everything."

          # The compare API returns at most 300 files. At the cap the list is
          # truncated and we cannot tell what else is in there.
          [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] \
            || run_everything "Changed file list is truncated at the API cap, running everything."

          # Paths that cannot affect the build or the tests.
          docs_only='^(docs/|images/|\.vscode/|\.devcontainer/)|\.md$'

          code=false
          docs=false
          printf '%s\n' "$files" | grep -qE  "$docs_only" && docs=true
          printf '%s\n' "$files" | grep -qvE "$docs_only" && code=true

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          {
            echo "### Changed files"
            echo
            echo "code: \`$code\`, docs: \`$docs\`"
            echo
            printf '%s\n' "$files" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

  # Checks that only make sense for the documentation-only lane. Empty for now, it
  # exists so the shape is in place and adding a markdown linter is one step.
  docs:
    name: Docs checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nothing to check yet
        run: echo "No documentation checks configured yet."

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build module (inline, locked restore)
        shell: pwsh
        run: |
          "Running .NET SDK v$(dotnet --version)"
          ./build.ps1 -LockedRestore -Clean -Inline

      # Publish the built tree so every test leg runs the exact same build.
      # Mirrors Azure's `publish: $(Build.SourcesDirectory)` + .artifactignore.
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-build
          retention-days: 1
          include-hidden-files: true
          path: |
            bin/
            src/
            tst/
            build.ps1
            test.ps1
            global.json
            !src/csharp/**/bin/**
            !src/csharp/**/obj/**
            !src/csharp/.vs/**

  test:
    name: ${{ matrix.name }}
    needs: [changes, build]
    if: needs.changes.outputs.code != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # PowerShell 7 (psexe: pwsh) — latest + one previous GA per OS.
          - { name: 'PS7 - Ubuntu latest',    id: ps7-ubuntu-latest,   os: ubuntu-latest,  psexe: pwsh }
          - { name: 'PS7 - Ubuntu 22.04',     id: ps7-ubuntu-2204,     os: ubuntu-22.04,   psexe: pwsh }
          - { name: 'PS7 - macOS latest',     id: ps7-macos-latest,    os: macos-latest,   psexe: pwsh }
          - { name: 'PS7 - macOS 14',         id: ps7-macos-14,        os: macos-14,       psexe: pwsh }
          - { name: 'PS7 - Windows latest',   id: ps7-windows-latest,  os: windows-latest, psexe: pwsh }
          - { name: 'PS7 - Windows 2022',     id: ps7-windows-2022,    os: windows-2022,   psexe: pwsh }
          # Windows PowerShell 5.1 (psexe: powershell) — Windows only.
          - { name: 'PS5.1 - Windows latest', id: ps51-windows-latest, os: windows-latest, psexe: powershell }
          - { name: 'PS5.1 - Windows 2022',   id: ps51-windows-2022,   os: windows-2022,   psexe: powershell }
    steps:
      # No checkout: the legs run against the artifact from Build, so they test
      # the exact same build.
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pester-build
          path: .

      # `shell:` cannot take a matrix expression, so run from a fixed pwsh (present
      # on every runner) and launch the leg's interpreter: pwsh for PS7, powershell
      # (Windows PowerShell 5.1) for the 5.1 legs. exit $LASTEXITCODE so a failure
      # in the launched process still fails the job.
      - name: Test Pester
        shell: pwsh
        run: |
          & ${{ matrix.psexe }} -NoProfile -Command "& ./test.ps1 -CI -CC -PassThru -NoBuild"
          exit $LASTEXITCODE

      # Render this leg's JaCoCo coverage into the job summary (Azure parity).
      - name: Coverage summary
        if: always()
        shell: pwsh
        env:
          LEG_NAME: ${{ matrix.name }}
        run: |
          $ErrorActionPreference = 'Continue'
          function Append-Summary([string]$text) {
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $text, (New-Object System.Text.UTF8Encoding($false)))
          }
          try {
            if (-not (Test-Path 'coverage.xml')) {
              Append-Summary "## Coverage - $env:LEG_NAME`n`nNo coverage.xml was produced.`n"
              return
            }
            [xml]$xml = Get-Content -LiteralPath 'coverage.xml'
            $counters = @($xml.report.counter)   # report-level totals (direct children)
            $rows = foreach ($type in 'LINE','INSTRUCTION','METHOD','CLASS') {
              $c = $counters | Where-Object { $_.type -eq $type }
              if ($c) {
                $cov = [int]$c.covered; $mis = [int]$c.missed; $tot = $cov + $mis
                $pct = if ($tot) { [math]::Round(100.0 * $cov / $tot, 2) } else { 0 }
                $pctStr = ([double]$pct).ToString('0.##', [System.Globalization.CultureInfo]::InvariantCulture)
                [pscustomobject]@{ Type = $type; Covered = $cov; Missed = $mis; Total = $tot; PctStr = $pctStr }
              }
            }
            $line = $rows | Where-Object { $_.Type -eq 'LINE' }
            $sb = [System.Text.StringBuilder]::new()
            [void]$sb.AppendLine("## Coverage - $env:LEG_NAME`n")
            if ($line) { [void]$sb.AppendLine("**Line coverage: $($line.PctStr)%**  ($($line.Covered)/$($line.Total) lines)`n") }
            [void]$sb.AppendLine("| Metric | Covered | Missed | Total | % |")
            [void]$sb.AppendLine("|---|--:|--:|--:|--:|")
            foreach ($r in $rows) { [void]$sb.AppendLine("| $($r.Type) | $($r.Covered) | $($r.Missed) | $($r.Total) | $($r.PctStr)% |") }
            Append-Summary ($sb.ToString() + "`n")
            if ($line) { Write-Host "Line coverage ($env:LEG_NAME): $($line.PctStr)%" }
          } catch {
            Append-Summary "## Coverage - $env:LEG_NAME`n`nCoverage summary failed: $($_.Exception.Message)`n"
          }

      # Upload this leg's JaCoCo report to Codecov. `flags` keeps a per-leg
      # breakdown while Codecov merges all legs into one project report.
      # pester/Pester is public, so upload works tokenless (v5 opt-out); a
      # CODECOV_TOKEN secret, if set, makes uploads more reliable.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          disable_search: true
          flags: ${{ matrix.id }}
          name: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: results-${{ matrix.id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            testResults.xml
            coverage.xml

  # Single gate after the matrix so branch protection and auto-merge only need to
  # require "Done" instead of listing all 8 legs. This is the check to require on
  # main and on the release branches.
  # It also renders the failed tests and a consolidated coverage table, so one
  # page shows what broke and where (one glance at all legs).
  done:
    name: Done
    needs: [changes, docs, build, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The two summary scripts live in .github/scripts so they can be edited with
      # syntax highlighting and run locally. This job does not otherwise need the
      # repository, so check out only that directory.
      # Checkout runs first on purpose: it cleans the working directory, which would
      # delete the downloaded artifacts if it ran after them.
      - name: Checkout summary scripts
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts

      - name: Download test results
        if: always() && needs.changes.outputs.code != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: results-*
          path: results

      - name: Test results
        if: always() && needs.changes.outputs.code != 'false'
        shell: pwsh
        run: ./.github/scripts/Write-TestResultSummary.ps1 -Path results

      - name: Consolidated coverage
        if: always() && needs.changes.outputs.code != 'false'
        shell: pwsh
        run: ./.github/scripts/Write-CoverageSummary.ps1 -Path results

      # The gate. Note `!= 'false'` and not `== 'true'`: only a positive
      # "everything changed is documentation" skips the tests. Anything else,
      # including a `changes` job that failed outright, demands real results.
      - name: Gate
        run: |
          if [ "${{ needs.changes.outputs.code }}" != "false" ]; then
            echo "Code changed. Build: ${{ needs.build.result }}, tests: ${{ needs.test.result }}"
            [ "${{ needs.build.result }}" = "success" ] || exit 1
            [ "${{ needs.test.result }}" = "success" ] || exit 1
          else
            echo "Documentation only, the build and the test matrix were skipped."
            echo "Docs checks: ${{ needs.docs.result }}"
            [ "${{ needs.docs.result }}" != "failure" ] || exit 1
          fi
          echo "done"
