name: Code analysis

on:
  push:
    branches: [main]
  # No branches filter, same reason as ci.yml: a stacked pull request targets the
  # branch below it, and PSScriptAnalyzer is a required check on main. This one was
  # also narrower than ci.yml, so pull requests onto rel/* and dev/* never got it.
  pull_request:
  workflow_dispatch:

jobs:
  pssa:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Installed directly rather than through potatoqualitee/psmodulecache. That is a
      # composite action and its own actions/cache reference is not pinned - v6.2.1 uses
      # actions/cache@v4.2.0, v6.3 uses @v5.0.5 - and sha_pinning_required applies to
      # nested references too, so the whole job fails while we depend on it. Two modules
      # from PSGallery take seconds, so the cache was not buying much.
      - name: Install PSScriptAnalyzer and ConvertToSARIF
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module ConvertToSARIF -RequiredVersion 1.0.0 -Force -Scope CurrentUser

      # Not using microsoft/psscriptanalyzer-action@v1.0 because we're missing psm1 in src + need to exclude generated ps1xml
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module ConvertToSARIF -Force

          Get-ChildItem -Path ./src/ -Filter *.ps* -Recurse -File |
          Where-Object { $_.Name -ne 'Sync-WithProfiler.ps1' } |
          Invoke-ScriptAnalyzer -Settings ./.github/workflows/PSScriptAnalyzerSettings.psd1 |
          ConvertTo-SARIF -FilePath results.sarif

      # Upload the SARIF file generated in the previous step.
      # A pull request from a fork gets a read-only token, so it cannot write code
      # scanning results and this step would fail. The analysis above still runs, so
      # a fork contributor sees the PSScriptAnalyzer output in the job log.
      - name: Upload SARIF results file
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
