version: 2
updates:
  # Keep the GitHub Actions used by the workflows current — in particular so we
  # stay ahead of Node.js runtime deprecations, which land as major bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # One batched pull request a month. The actions are pinned, so nothing
      # updates until we merge it, and a monthly review keeps the noise low.
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
