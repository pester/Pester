# Codecov configuration for .github/workflows/ci.yml. Coverage is uploaded per
# matrix leg using flags.
#
# Coverage status is "informational", so Codecov reports the numbers but never
# posts a failing or blocking commit status.

codecov:
  # We upload one report per matrix leg (8 legs). Wait for all of them before
  # finalizing notifications/PR comment so the merged picture is complete.
  notify:
    after_n_builds: 8

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, flags, files"
  require_changes: false

# Per-leg flags (ps7-ubuntu-latest, ps51-windows-2022, ...) uploaded by ci.yml.
# Carry a flag's last-known coverage forward on commits where it didn't upload.
flag_management:
  default_rules:
    carryforward: true
